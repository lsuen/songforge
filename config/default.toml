# songforge 算法与相对路径的唯一事实来源（可提交）。
# 本机绝对路径请写 local.toml（gitignore），勿写进本文件。
# ComfyUI workflow 图仍是 JSON，只放在 workflows/ 或 Comfy 模板路径下。

[engine]
server = "http://127.0.0.1:8188"
timeout_sec = 3600
poll_interval_sec = 10
submit_retries = 3

[model]
checkpoint = "ace_step_1.5_turbo_swl_fused.safetensors"
lora = "swl_voice_best_ep257.safetensors"
lora_model_strength = 0.5
lora_clip_strength = 0.5
denied_checkpoints = [
  "yue2_3b_int8_convrot.safetensors",
  "ace_step_1.5_turbo_aio.safetensors",
]

[sampler]
shift = 5.5
sampling = "flow"
steps = 28
cfg = 2.0
sampler_name = "euler"
scheduler = "simple"
denoise = 1.0

[encode]
cfg_scale = 3.0
temperature = 0.68
top_p = 0.88
top_k = 50
min_p = 0.02
generate_audio_codes = true
timesignature = "4"

# 相对路径一律相对本仓根（clone 到哪就是哪）。
# 本机 comfy_root / qc_python / music_dir / server 放 local.toml。
[paths]
workflow_template = "workflows/template.json"
runs_dir = "data/runs"
tmp_dir = "data/tmp"
lyrics_dir = "input/lyrics"
qc_cache_dir = "cache/qc"
style_cache_dir = "cache/style"
index_dir = "index"
catalog_file = "index/catalog.jsonl"
baseline_dir = "config/baseline"
output_prefix = "MyMusic"
output_format = "flac"

[song]
language = "zh"
time_signature = "4"
duration_range = [150, 200]
# 短视频等场景显式放行；不削弱主区间
duration_extra_ranges = [[100, 130]]

# 死心塌地时长对应：阈值由 8 首已验证实歌反推，改前先跑 selftest。
[lyrics]
sing_bar_ratio = 0.70
intro_bars = 8
syllable_per_bar_min = 4.40
syllable_per_bar_max = 7.80
line_syllable_max = 12
ideal_line_syllable = [5, 12]

# sparse = 音乐主导、人声点缀（英文低声吟唱等）
[lyrics.profiles.sparse]
sing_bar_ratio = 0.25
syllable_per_bar_min = 4.40
syllable_per_bar_max = 7.80
line_syllable_max = 12
ideal_line_syllable = [3, 12]

[rules]
trigger_word = "swlvoice"
intro_bars = 8
